name: Python teaching examples
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python examples/01_foundations/01_confounding.py
      - run: python examples/02_double_ml/01_plr_from_scratch.py
      - run: pytest -q
